name: Keep face service warm

# Pings the deployed face-recognition service every 10 minutes — comfortably
# under the ~15-minute idle timeout most free hosting tiers use — so it
# never actually goes to sleep, instead of letting it sleep and paying the
# cold-start cost (reloading ML models) on the next real scan.
#
# Needs FACE_SERVICE_URL set as a repo secret (Settings → Secrets and
# variables → Actions) once the service is actually deployed somewhere —
# this workflow does nothing useful until that points at a real URL.
#
# Two honest caveats, not hidden: GitHub may delay a scheduled run by a few
# minutes during high load elsewhere on their infrastructure, and GitHub
# auto-disables scheduled workflows on a repo after 60 days with no commits
# (re-enable from the Actions tab if that happens — doesn't need a code
# change, just a click).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger a ping manually from the Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping face service health endpoint
        run: |
          if [ -z "${{ secrets.FACE_SERVICE_URL }}" ]; then
            echo "FACE_SERVICE_URL secret isn't set yet — nothing to ping. Set it once the service is deployed."
            exit 0
          fi
          curl -sf "${{ secrets.FACE_SERVICE_URL }}/health" && echo "ok" || echo "ping failed (service may be starting up, or genuinely down)"
